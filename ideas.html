<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Velox — Ideas & Tasks</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Lato:wght@300;400;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #0a1628; --navy2: #122040; --gold: #e8a020; --gold2: #f5b732;
  --white: #ffffff; --offwhite: #f8f6f1; --gray: #6b7280; --border: #e2e8f0;
  --red: #c0392b; --green: #1b6b3a;
  --font-head: 'Playfair Display', Georgia, serif;
  --font-body: 'Lato', sans-serif;
  --font-acc: 'Oswald', sans-serif;
}
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); background: var(--offwhite); color: var(--navy); min-height: 100vh; }

nav {
  background: var(--navy); padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,0.3);
}
.logo { font-family: var(--font-acc); font-size: 20px; font-weight: 600; color: var(--white); letter-spacing: 0.04em; }
.logo span { color: var(--gold); }
.private-badge {
  font-family: var(--font-acc); font-size: 11px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
  background: rgba(232,160,32,0.12); color: var(--gold);
  border: 1px solid rgba(232,160,32,0.25); padding: 4px 12px;
}

.page-header {
  background: var(--navy); padding: 40px 28px 36px; text-align: center;
  position: relative; overflow: hidden;
}
.page-header::before {
  content: 'IDEAS'; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-head); font-size: clamp(60px, 14vw, 140px);
  font-weight: 900; color: rgba(255,255,255,0.025);
  letter-spacing: -0.04em; white-space: nowrap; pointer-events: none;
}
.page-header h1 {
  font-family: var(--font-head); font-size: clamp(26px, 4vw, 40px);
  font-weight: 900; color: var(--white); margin-bottom: 8px;
  position: relative;
}
.page-header h1 em { font-style: normal; color: var(--gold); }
.page-header p { font-size: 15px; color: #b0bfd4; line-height: 1.6; position: relative; }

.board {
  max-width: 1100px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 24px; padding: 32px 24px 48px;
}

.column { display: flex; flex-direction: column; gap: 16px; }

.col-header {
  background: var(--navy); color: var(--white);
  padding: 18px 22px; display: flex; align-items: center; gap: 12px;
  position: relative;
}
.col-header::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.ideas-col .col-header::before { background: var(--gold); }
.tasks-col .col-header::before { background: #e05a2b; }
.col-icon { font-size: 20px; }
.col-title { font-family: var(--font-acc); font-size: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.col-count {
  margin-left: auto; font-family: var(--font-acc); font-size: 13px;
  background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7);
  padding: 2px 10px; letter-spacing: 0.06em;
}

.add-form { background: var(--white); border: 1px solid var(--border); padding: 20px; }
.form-row { display: flex; gap: 10px; margin-bottom: 10px; }
.form-row:last-child { margin-bottom: 0; }
.name-select {
  width: 120px; flex-shrink: 0;
  font-family: var(--font-body); font-size: 14px;
  padding: 10px 12px; border: 1.5px solid var(--border);
  background: var(--offwhite); color: var(--navy);
  cursor: pointer; appearance: none; -webkit-appearance: none;
  outline: none;
}
.name-select:focus { border-color: var(--gold); }
.text-input {
  flex: 1; font-family: var(--font-body); font-size: 14px;
  padding: 10px 14px; border: 1.5px solid var(--border);
  background: var(--white); color: var(--navy);
  outline: none; resize: none;
}
.text-input:focus { border-color: var(--gold); }
.add-btn {
  width: 100%; font-family: var(--font-acc); font-size: 14px;
  font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 12px; border: none; cursor: pointer;
  transition: opacity 0.15s;
}
.add-btn:hover { opacity: 0.88; }
.ideas-col .add-btn { background: var(--gold); color: var(--navy); }
.tasks-col .add-btn { background: #e05a2b; color: var(--white); }

.items-list { display: flex; flex-direction: column; gap: 10px; }

.item-card {
  background: var(--white); border: 1px solid var(--border);
  padding: 16px 18px; position: relative;
  border-left: 4px solid transparent;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.item-card:hover { box-shadow: 0 4px 16px rgba(10,22,40,0.08); }
.ideas-col .item-card { border-left-color: var(--gold); }
.tasks-col .item-card { border-left-color: #e05a2b; }
.tasks-col .item-card.done { border-left-color: var(--green); opacity: 0.7; }
.tasks-col .item-card.done .item-text { text-decoration: line-through; color: var(--gray); }

.item-meta {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.item-author {
  font-family: var(--font-acc); font-size: 12px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold);
}
.tasks-col .item-card .item-author { color: #e05a2b; }
.tasks-col .item-card.done .item-author { color: var(--green); }
.item-time { font-size: 11px; color: var(--gray); margin-left: auto; }
.item-text { font-size: 14px; color: var(--navy); line-height: 1.6; }
.item-actions { display: flex; gap: 8px; margin-top: 12px; }
.action-btn {
  font-family: var(--font-acc); font-size: 11px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 12px; border: 1px solid var(--border);
  background: transparent; color: var(--gray); cursor: pointer;
  transition: all 0.15s;
}
.action-btn:hover { color: var(--navy); border-color: var(--navy); }
.action-btn.done-btn:hover { color: var(--green); border-color: var(--green); }
.action-btn.done-btn.active { color: var(--green); border-color: var(--green); background: rgba(27,107,58,0.06); }
.action-btn.del-btn:hover { color: var(--red); border-color: var(--red); }

.empty-state {
  text-align: center; padding: 32px 20px;
  font-size: 14px; color: var(--gray); font-style: italic;
  background: var(--white); border: 1px dashed var(--border);
}

footer {
  background: var(--navy); padding: 24px;
  text-align: center; font-family: var(--font-acc);
  font-size: 12px; color: #4a6080; letter-spacing: 0.06em;
}
footer span { color: var(--gold); }

@media (max-width: 700px) {
  .board { grid-template-columns: 1fr; padding: 20px 16px 40px; }
  .form-row { flex-direction: column; }
  .name-select { width: 100%; }
}
</style>
</head>
<body>

<nav>
  <div class="logo">STUD<span>IO</span> <span>VE</span>LOX<span>.</span></div>
  <div class="private-badge">🔒 Phil & Evan only</div>
</nav>

<div class="page-header">
  <h1>Ideas & <em>Tasks</em></h1>
  <p>A shared board for Phil & Evan — new ideas on the left, must-do tasks on the right. Saves automatically.</p>
</div>

<div class="board">

  <!-- IDEAS COLUMN -->
  <div class="column ideas-col">
    <div class="col-header">
      <span class="col-icon">💡</span>
      <span class="col-title">Ideas</span>
      <span class="col-count" id="ideas-count">0</span>
    </div>
    <div class="add-form">
      <div class="form-row">
        <select class="name-select" id="idea-author">
          <option value="Phil">Phil</option>
          <option value="Evan">Evan</option>
        </select>
        <textarea class="text-input" id="idea-text" rows="2" placeholder="New idea — website feature, content, marketing..."></textarea>
      </div>
      <button class="add-btn" onclick="addIdea()">+ Add idea</button>
    </div>
    <div class="items-list" id="ideas-list"></div>
  </div>

  <!-- TASKS COLUMN -->
  <div class="column tasks-col">
    <div class="col-header">
      <span class="col-icon">✅</span>
      <span class="col-title">Tasks</span>
      <span class="col-count" id="tasks-count">0</span>
    </div>
    <div class="add-form">
      <div class="form-row">
        <select class="name-select" id="task-author">
          <option value="Phil">Phil</option>
          <option value="Evan">Evan</option>
        </select>
        <textarea class="text-input" id="task-text" rows="2" placeholder="Must-do task — e.g. Facebook ads, Google profile, client follow-up..."></textarea>
      </div>
      <button class="add-btn" onclick="addTask()">+ Add task</button>
    </div>
    <div class="items-list" id="tasks-list"></div>
  </div>

</div>

<footer>
  <p>STUD<span>IO</span> <span>VE</span>LOX<span>.</span> &nbsp;·&nbsp; Private board — not publicly listed &nbsp;·&nbsp; phil@studiovelox.com</p>
</footer>

<script>
function timeAgo(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  const hrs = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  if (hrs < 24) return hrs + 'h ago';
  return days + 'd ago';
}

function renderIdeas(items) {
  const list = document.getElementById('ideas-list');
  document.getElementById('ideas-count').textContent = items.length;
  if (!items.length) {
    list.innerHTML = '<div class="empty-state">No ideas yet — add the first one above!</div>';
    return;
  }
  list.innerHTML = items.slice().reverse().map(item => `
    <div class="item-card">
      <div class="item-meta">
        <span class="item-author">${item.author}</span>
        <span class="item-time">${timeAgo(item.ts)}</span>
      </div>
      <div class="item-text">${item.text}</div>
      <div class="item-actions">
        <button class="action-btn del-btn" onclick="deleteIdea('${item.id}')">Delete</button>
      </div>
    </div>`).join('');
}

function renderTasks(items) {
  const list = document.getElementById('tasks-list');
  document.getElementById('tasks-count').textContent = items.filter(t => !t.done).length + ' open';
  if (!items.length) {
    list.innerHTML = '<div class="empty-state">No tasks yet — add the first one above!</div>';
    return;
  }
  const sorted = items.slice().sort((a, b) => a.done - b.done || b.ts - a.ts);
  list.innerHTML = sorted.map(item => `
    <div class="item-card ${item.done ? 'done' : ''}">
      <div class="item-meta">
        <span class="item-author">${item.done ? '✓ ' : ''}${item.author}</span>
        <span class="item-time">${timeAgo(item.ts)}</span>
      </div>
      <div class="item-text">${item.text}</div>
      <div class="item-actions">
        <button class="action-btn done-btn ${item.done ? 'active' : ''}" onclick="toggleTask('${item.id}')">${item.done ? 'Undo' : 'Mark done'}</button>
        <button class="action-btn del-btn" onclick="deleteTask('${item.id}')">Delete</button>
      </div>
    </div>`).join('');
}

async function loadIdeas() {
  const res = await fetch('/api/ideas');
  const items = await res.json();
  renderIdeas(items);
}

async function loadTasks() {
  const res = await fetch('/api/tasks');
  const items = await res.json();
  renderTasks(items);
}

async function addIdea() {
  const text = document.getElementById('idea-text').value.trim();
  const author = document.getElementById('idea-author').value;
  if (!text) return;
  document.getElementById('idea-text').value = '';
  const res = await fetch('/api/ideas', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, author })
  });
  renderIdeas(await res.json());
}

async function addTask() {
  const text = document.getElementById('task-text').value.trim();
  const author = document.getElementById('task-author').value;
  if (!text) return;
  document.getElementById('task-text').value = '';
  const res = await fetch('/api/tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, author })
  });
  renderTasks(await res.json());
}

async function deleteIdea(id) {
  if (!confirm('Delete this idea?')) return;
  const res = await fetch('/api/ideas', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  renderIdeas(await res.json());
}

async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  const res = await fetch('/api/tasks', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  renderTasks(await res.json());
}

async function toggleTask(id) {
  const res = await fetch('/api/tasks', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  renderTasks(await res.json());
}

document.getElementById('idea-text').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addIdea(); }
});
document.getElementById('task-text').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addTask(); }
});

setInterval(() => { loadIdeas(); loadTasks(); }, 30000);

loadIdeas();
loadTasks();
</script>
</body>
</html>
