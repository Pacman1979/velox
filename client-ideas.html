<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Client ideas — Studio Velox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<script>var PINLEN = 6;</script>
<style>
:root{
  --navy:#0a1628; --navy2:#122040; --gold:#e8a020; --gold2:#f5b732;
  --ink:#1b2430; --dim:#5d6b7e; --line:#dfe4ea; --bg:#f6f7f9; --card:#fff;
  --accent:#1f6f5c; --red:#c0392b;
  --head:'Playfair Display',Georgia,serif; --body:'Lato',sans-serif;
  --acc:'Oswald',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ---------- pin ---------- */
#pin{position:fixed;inset:0;background:var(--navy);color:#fff;display:grid;
  place-content:center;text-align:center;padding:24px;z-index:50}
#pin .logo{font-family:var(--acc);font-weight:600;letter-spacing:.22em;
  font-size:13px;color:var(--gold);margin-bottom:22px}
#pin h1{font-family:var(--head);font-weight:600;font-size:26px;margin:0 0 6px}
#pin p{color:#9fb3cc;font-size:15px;margin:0 0 24px}
.dots{display:flex;gap:11px;justify-content:center;margin:0 0 26px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid #46607f}
.dot.on{background:var(--gold);border-color:var(--gold)}
.dot.bad{border-color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:11px;justify-content:center}
.key{height:62px;border-radius:9px;border:1px solid #2a4260;
  background:#15263f;color:#fff;font-size:22px;font-family:var(--body);cursor:pointer}
.key:hover{background:#1d3250}
.key.sm{font-size:14px;font-family:var(--acc);letter-spacing:.1em}
#pin-e{color:var(--red);min-height:1.3em;margin:16px 0 0;font-size:14px}

/* ---------- shell ---------- */
#app{display:none}
.bar{background:var(--navy);color:#fff;padding:13px 18px;display:flex;
  gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.bar .brand{font-family:var(--acc);font-weight:600;font-size:13px;
  letter-spacing:.22em;color:var(--gold)}
.bar .t{font-family:var(--head);font-size:17px}
.bar .count{margin-left:auto;font-size:13px;color:#9fb3cc}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 70px}

/* ---------- client groups ---------- */
.client{font-family:var(--acc);font-weight:500;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);margin:26px 0 10px;
  display:flex;gap:10px;align-items:center}
.client:first-child{margin-top:0}
.client a{color:var(--dim)}
.client span{flex:1;height:1px;background:var(--line)}

/* ---------- an idea ---------- */
.idea{background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:16px 18px;margin:0 0 12px}
.idea.unanswered{border-left:3px solid var(--gold)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;
  color:var(--dim);margin:0 0 8px}
.chip{font-family:var(--acc);font-weight:500;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;padding:2px 8px;border-radius:3px;background:#eceff3;color:var(--dim)}
.chip.new{background:#fdf2dc;color:#8a6500}
.chip.doing{background:#e7f1ee;color:var(--accent)}
.chip.done{background:#e3efe5;color:#2a6b36}
.chip.no{background:#f2e7e5;color:#8a3c2e}
.cat{font-family:var(--acc);font-weight:500;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:#9a6a0b}
.body{margin:0 0 14px;white-space:pre-wrap;font-size:16px}

textarea,select{font:inherit;font-size:15px;color:var(--ink);background:#fff;
  border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
textarea:focus,select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(31,111,92,.14)}
.lbl{display:block;font-family:var(--acc);font-weight:500;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
.controls{display:flex;gap:10px;align-items:flex-end;margin:12px 0 0;flex-wrap:wrap}
.controls > div{flex:0 0 170px}
button.save{font-family:var(--acc);font-weight:500;font-size:14px;letter-spacing:.09em;
  text-transform:uppercase;background:var(--accent);color:#fff;border:0;border-radius:4px;
  padding:11px 20px;cursor:pointer}
button.save:hover:not(:disabled){background:#2d8a73}
button.save:disabled{opacity:.5;cursor:default}
button.save:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.said{font-size:13px;color:var(--accent);margin-left:4px}
.warn{font-size:13px;color:#8a3c2e;margin:8px 0 0}
.empty{color:var(--dim);text-align:center;padding:46px 16px;font-size:16px}
/* The board roster. A board with no PIN is open to the first person who
   opens it, so it is called out rather than listed quietly. */
.boards{background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:14px 18px;margin:0 0 22px}
.boards h2{font-family:var(--acc);font-weight:500;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.brow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.brow:first-of-type{border-top:0}
.brow .nm{font-weight:700;flex:1 1 180px}
.pinchip{font-family:var(--acc);font-weight:500;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;padding:2px 9px;border-radius:3px}
.pinchip.set{background:#e3efe5;color:#2a6b36}
.pinchip.unset{background:#fdf2dc;color:#8a6500}
.brow button{font-family:var(--acc);font-weight:500;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;background:#fff;color:var(--dim);border:1.5px solid var(--line);
  border-radius:4px;padding:5px 11px;cursor:pointer}
.brow button:hover{border-color:#8a3c2e;color:#8a3c2e}
.boards .warn{font-size:13px;color:#8a6500;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="pin">
  <div class="logo">STUDIO VELOX</div>
  <h1>Client ideas</h1>
  <p>Private &mdash; enter your PIN</p>
  <div class="dots" id="dots"></div>
  <div class="pad">
    <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
    <button class="key sm" data-k="del">Del</button><button class="key" data-k="0">0</button><span></span>
  </div>
  <p id="pin-e"></p>
</div>

<div id="app">
  <div class="bar">
    <span class="brand">STUDIO VELOX</span>
    <span class="t">Client ideas</span>
    <span class="count" id="count"></span>
  </div>
  <div class="wrap">
    <div id="boards"></div>
    <div id="list"><p class="empty">Loading&hellip;</p></div>
  </div>
</div>

<script>
function svPin(){try{return sessionStorage.getItem('sv_pin')||'';}catch(e){return '';}}
function svSetPin(p){try{sessionStorage.setItem('sv_pin',p);}catch(e){}}
(function(){
  var f=window.fetch;
  window.fetch=function(u,o){
    try{ if(typeof u==='string'&&u.indexOf('/api/')===0){
      o=o||{}; var h=new Headers(o.headers||{}); h.set('X-Velox-Pin',svPin());
      o=Object.assign({},o,{headers:h});
    }}catch(e){}
    return f.call(window,u,o);
  };
})();

(function () {
  'use strict';
  var pin = '', ideas = [];
  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- pin ---------------- */
  (function(){ var h=''; for(var i=0;i<PINLEN;i++) h+='<i class="dot" id="d'+i+'"></i>';
    $('dots').innerHTML=h; })();
  function dots(){ for(var i=0;i<PINLEN;i++) $('d'+i).classList.toggle('on', i<pin.length); }
  function press(k){
    if(k==='del'){ pin=pin.slice(0,-1); $('pin-e').textContent=''; dots(); return; }
    if(pin.length>=PINLEN) return;
    pin+=k; dots();
    if(pin.length===PINLEN) check();
  }
  function check(){
    fetch('/api/checkpin',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin:pin})})
      .then(function(r){ return r.json().then(function(d){ return {d:d,status:r.status}; }); })
      .then(function(x){
        if(x.d&&x.d.ok){ svSetPin(pin); unlock(); }
        else bad(x.status===429?'Too many attempts — wait an hour':'');
      }).catch(function(){ bad(); });
  }
  function bad(msg){
    var ds=document.querySelectorAll('.dot');
    ds.forEach(function(d){ d.classList.remove('on'); d.classList.add('bad'); });
    $('pin-e').textContent = msg || 'Wrong PIN';
    setTimeout(function(){ ds.forEach(function(d){ d.classList.remove('bad'); });
      $('pin-e').textContent=''; pin=''; dots(); }, 1100);
  }
  document.querySelectorAll('.key').forEach(function(b){
    b.addEventListener('click', function(){ press(b.getAttribute('data-k')); });
  });
  document.addEventListener('keydown', function(e){
    if ($('pin').style.display === 'none') return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('del');
  });

  function unlock(){ $('pin').style.display='none'; $('app').style.display='block'; load(); }

  /* ---------------- data ---------------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function when(iso){
    if(!iso) return '';
    var d = new Date(String(iso).replace(' ','T') + (/[Zz]|[+\-]\d\d:?\d\d$/.test(iso)?'':'Z'));
    if (isNaN(d)) return '';
    return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
  }

  var LABEL = { 'new':'New', seen:'Seen', doing:'In progress', done:'Done', no:'Not this time' };
  var CATNAME = { website:'Website', events:'Events', marketing:'Marketing',
                  services:'Services', other:'Other' };

  function load(){
    fetch('/api/client-ideas-admin')
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d.ok) throw new Error(d.error||'Could not load');
        ideas = d.ideas || [];
        drawBoards(d.boards || []);
        draw();
      })
      .catch(function(e){
        $('list').innerHTML = '<p class="empty">'+esc(e.message)+'</p>';
      });
  }

  function drawBoards(boards){
    if (!boards.length){ $('boards').innerHTML = ''; return; }
    var unset = boards.filter(function(b){ return !Number(b.has_pin); });

    $('boards').innerHTML = '<div class="boards"><h2>Boards</h2>'
      + boards.map(function(b){
          var on = Number(b.has_pin);
          return '<div class="brow">'
            + '<span class="nm">' + esc(b.name) + '</span>'
            + '<span class="pinchip ' + (on ? 'set' : 'unset') + '">'
            +   (on ? 'PIN set' : 'No PIN yet') + '</span>'
            + '<span style="color:var(--dim)">' + Number(b.ideas) + ' ideas</span>'
            + (on ? '<button data-reset="' + b.id + '">Reset PIN</button>' : '')
            + '</div>';
        }).join('')
      + (unset.length
          ? '<p class="warn">' + unset.length + ' board'
            + (unset.length > 1 ? 's have' : ' has')
            + ' no PIN yet \u2014 until the client sets one, anyone who finds the '
            + 'URL can. Send them the link and ask them to set it now.</p>'
          : '')
      + '</div>';
  }

  /* Resetting clears the PIN so the client can choose a new one. Phil can
     never read a PIN, only clear it — which is the point of the design. */
  document.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button[data-reset]') : null;
    if (!b) return;
    var id = Number(b.getAttribute('data-reset'));
    if (!confirm('Clear this client\u2019s PIN?\n\nThey will be asked to choose a new '
      + 'one next time they open the page. Anyone who opens it before they do '
      + 'could set it instead, so tell them first.')) return;
    b.disabled = true;
    fetch('/api/client-ideas-admin', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'resetpin', client_id:id })
    }).then(function(r){ return r.json(); })
      .then(function(d){ if(!d.ok) throw new Error(d.error||'Could not reset');
                         load(); })
      .catch(function(err){ alert(err.message); b.disabled = false; });
  });

  function draw(){
    if (!ideas.length){
      $('list').innerHTML = '<p class="empty">No client ideas yet.</p>';
      $('count').textContent = '';
      return;
    }

    /* Unanswered first within each client, because those are the ones that
       cost you something by sitting there. */
    var waiting = ideas.filter(function(i){ return !i.reply; }).length;
    $('count').textContent = waiting
      ? waiting + ' waiting on a reply'
      : 'All answered';

    var groups = {};
    ideas.forEach(function(i){
      (groups[i.client] = groups[i.client] || []).push(i);
    });

    var html = '';
    Object.keys(groups).sort().forEach(function(client){
      var rows = groups[client].slice().sort(function(a,b){
        if (!a.reply !== !b.reply) return a.reply ? 1 : -1;
        return String(b.created_at).localeCompare(String(a.created_at));
      });
      var site = (rows[0].site_url || '').replace(/\/$/,'') + '/ideas';
      html += '<p class="client">' + esc(client)
            + ' <span></span> <a href="' + esc(site) + '" target="_blank" rel="noopener">their page</a></p>';

      rows.forEach(function(i){
        var st = i.status || 'new';
        html += '<div class="idea' + (i.reply ? '' : ' unanswered') + '" data-id="' + i.id + '">'
          + '<div class="meta">'
          +   '<span class="chip ' + esc(st) + '">' + esc(LABEL[st]||st) + '</span>'
          +   (i.category ? '<span class="cat">' + esc(CATNAME[i.category]||i.category) + '</span>' : '')
          +   (i.author ? '<span>' + esc(i.author) + '</span>' : '')
          +   '<span>' + esc(when(i.created_at)) + '</span>'
          + '</div>'
          + '<p class="body">' + esc(i.body) + '</p>'
          + '<label class="lbl" for="r' + i.id + '">Your reply — they see this on their page</label>'
          + '<textarea id="r' + i.id + '" maxlength="2000">' + esc(i.reply || '') + '</textarea>'
          + '<div class="controls">'
          +   '<div><label class="lbl" for="s' + i.id + '">Status</label>'
          +     '<select id="s' + i.id + '">'
          +       ['new','seen','doing','done','no'].map(function(v){
                    return '<option value="'+v+'"'+(v===st?' selected':'')+'>'+LABEL[v]+'</option>'; }).join('')
          +     '</select></div>'
          +   '<button class="save" data-save="' + i.id + '">Save</button>'
          +   '<span class="said" id="m' + i.id + '"></span>'
          + '</div>'
          + '</div>';
      });
    });
    $('list').innerHTML = html;
  }

  /* One delegated handler rather than one per button, so a redraw never
     leaves a dead listener behind. */
  document.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button[data-save]') : null;
    if (!b) return;
    var id = Number(b.getAttribute('data-save'));
    var reply = $('r'+id).value;
    var status = $('s'+id).value;
    var msg = $('m'+id);

    b.disabled = true;
    msg.textContent = 'Saving…';
    msg.style.color = '';

    fetch('/api/client-ideas-admin', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id:id, reply:reply, status:status })
    })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d.ok) throw new Error(d.error||'Could not save');
        /* Update the row in place rather than reloading, so the page does not
           jump away from what you were reading. */
        for (var i=0;i<ideas.length;i++) if (ideas[i].id===id) {
          ideas[i].reply = d.idea.reply;
          ideas[i].status = d.idea.status;
          ideas[i].replied_at = d.idea.replied_at;
        }
        msg.textContent = 'Saved — they can see it now';
        var card = b.closest('.idea');
        if (card) card.classList.toggle('unanswered', !d.idea.reply);
        var waiting = ideas.filter(function(x){ return !x.reply; }).length;
        $('count').textContent = waiting ? waiting + ' waiting on a reply' : 'All answered';
        setTimeout(function(){ msg.textContent=''; }, 2600);
      })
      .catch(function(err){
        msg.style.color = '#8a3c2e';
        msg.textContent = err.message;
      })
      .then(function(){ b.disabled = false; });
  });

  if (svPin()) unlock();
})();
</script>
</body>
</html>
