<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Velox — Client Work Log</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Lato:wght@300;400;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0a1628;--navy2:#122040;--gold:#e8a020;--gold2:#f5b732;--white:#ffffff;--offwhite:#f8f6f1;--gray:#6b7280;--border:#e2e8f0;--green:#1b6b3a;--purple:#7b5ea7;--orange:#e05a2b;--red:#c0392b;--font-head:'Playfair Display',Georgia,serif;--font-body:'Lato',sans-serif;--font-acc:'Oswald',sans-serif}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--offwhite);color:var(--navy);min-height:100vh}
#pin-screen{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}
#pin-screen::before{content:'CLIENTS';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--font-head);font-size:clamp(60px,14vw,160px);font-weight:900;color:rgba(255,255,255,0.025);letter-spacing:-0.04em;pointer-events:none;white-space:nowrap}
.pin-logo{font-family:var(--font-acc);font-size:22px;font-weight:600;color:var(--white);letter-spacing:0.04em;margin-bottom:48px;position:relative}
.pin-logo span{color:var(--gold)}
.pin-title{font-family:var(--font-head);font-size:clamp(22px,4vw,34px);font-weight:900;color:var(--white);margin-bottom:8px;text-align:center;position:relative}
.pin-sub{font-size:14px;color:#5a7090;margin-bottom:40px;text-align:center;position:relative}
.pin-dots{display:flex;gap:16px;margin-bottom:32px;position:relative}
.pin-dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);transition:all 0.15s}
.pin-dot.filled{background:var(--gold);border-color:var(--gold)}
.pin-dot.error{background:var(--red);border-color:var(--red)}
.pin-keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;position:relative}
.pin-key{width:72px;height:72px;border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:var(--white);font-family:var(--font-acc);font-size:22px;font-weight:500;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center}
.pin-key:hover{background:rgba(232,160,32,0.15);border-color:var(--gold)}
.pin-key.del{font-size:18px;color:#5a7090}
.pin-error{font-family:var(--font-acc);font-size:13px;letter-spacing:0.1em;color:var(--red);text-transform:uppercase;margin-top:20px;min-height:20px;text-align:center;position:relative}
#app{display:none}
nav{background:var(--navy);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,0.3);flex-wrap:wrap;gap:10px}
.logo{font-family:var(--font-acc);font-size:20px;font-weight:600;color:var(--white);letter-spacing:0.04em}
.logo span{color:var(--gold)}
.nav-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.private-badge{font-family:var(--font-acc);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;background:rgba(232,160,32,0.12);color:var(--gold);border:1px solid rgba(232,160,32,0.25);padding:4px 12px}
.nav-btn{font-family:var(--font-acc);font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;padding:6px 14px;cursor:pointer;border:1px solid;transition:all 0.2s}
.lock-btn{background:rgba(192,57,43,0.15);color:#e88;border-color:rgba(192,57,43,0.3)}
.lock-btn:hover{background:rgba(192,57,43,0.3)}
.edit-btn{background:rgba(232,160,32,0.12);color:var(--gold);border-color:rgba(232,160,32,0.3)}
.edit-btn:hover,.edit-btn.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.add-client-btn{background:var(--green);color:var(--white);border-color:var(--green);display:none}
.add-client-btn:hover{opacity:0.85}
.save-indicator{font-family:var(--font-acc);font-size:11px;color:var(--green);letter-spacing:0.1em;display:none}
.page-header{background:var(--navy);padding:40px 28px 36px;text-align:center;position:relative;overflow:hidden}
.page-header::before{content:'WORK LOG';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--font-head);font-size:clamp(40px,9vw,100px);font-weight:900;color:rgba(255,255,255,0.025);letter-spacing:-0.04em;white-space:nowrap;pointer-events:none}
.page-header h1{font-family:var(--font-head);font-size:clamp(24px,4vw,38px);font-weight:900;color:var(--white);margin-bottom:8px;position:relative}
.page-header h1 em{font-style:normal;color:var(--gold)}
.page-header p{font-size:15px;color:#b0bfd4;line-height:1.6;position:relative}
.stats-bar{background:rgba(232,160,32,0.08);border-bottom:1px solid rgba(232,160,32,0.15);padding:16px 28px}
.stats-inner{max-width:1100px;margin:0 auto;display:flex;gap:40px;flex-wrap:wrap}
.stat-item{text-align:center}
.stat-num{font-family:var(--font-head);font-size:28px;font-weight:900;color:var(--gold);line-height:1}
.stat-lbl{font-family:var(--font-acc);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#5a7090;margin-top:2px}
.clients-wrap{max-width:1100px;margin:0 auto;padding:40px 24px 60px;display:flex;flex-direction:column;gap:32px}
.client-card{background:var(--white);border:1px solid var(--border);position:relative}
.client-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.client-card.status-live::before{background:var(--gold)}
.client-card.status-concept::before{background:var(--purple)}
.client-card.status-progress::before{background:var(--orange)}
body.edit-mode .editable{outline:1px dashed rgba(232,160,32,0.5);min-width:40px;border-radius:2px;cursor:text}
body.edit-mode .editable:focus{outline:2px solid var(--gold);background:rgba(232,160,32,0.04)}
body.edit-mode .add-client-btn{display:inline-block!important}
body.edit-mode .add-item-row{display:flex!important}
body.edit-mode .del-item-btn{display:inline-flex!important}
body.edit-mode .add-section-row{display:flex!important}
body.edit-mode .del-section-btn{display:inline!important}
body.edit-mode .card-edit-bar{display:flex!important}
.add-item-row{display:none;margin-top:6px}
.add-item-btn{font-family:var(--font-acc);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);border:1px dashed rgba(232,160,32,0.4);background:rgba(232,160,32,0.04);padding:4px 10px;cursor:pointer;width:100%;text-align:center}
.add-item-btn:hover{background:rgba(232,160,32,0.12)}
.del-item-btn{display:none;align-items:center;justify-content:center;width:18px;height:18px;min-width:18px;background:rgba(192,57,43,0.1);color:var(--red);border:none;cursor:pointer;font-size:12px;border-radius:50%;margin-left:6px}
.del-item-btn:hover{background:var(--red);color:var(--white)}
.add-section-row{display:none;margin-top:16px}
.add-section-btn{font-family:var(--font-acc);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--green);border:1px dashed rgba(27,107,58,0.4);background:rgba(27,107,58,0.04);padding:6px 14px;cursor:pointer}
.add-section-btn:hover{background:rgba(27,107,58,0.1)}
.del-section-btn{display:none;font-size:10px;color:var(--red);border:none;background:none;cursor:pointer;margin-left:8px;font-family:var(--font-acc);letter-spacing:0.06em}
.card-edit-bar{display:none;padding:14px 26px;border-top:1px solid var(--border);background:rgba(232,160,32,0.03);justify-content:space-between;align-items:center}
.status-select{font-family:var(--font-acc);font-size:12px;padding:6px 10px;border:1px solid var(--border);background:var(--white);color:var(--navy);cursor:pointer}
.del-client-btn{font-family:var(--font-acc);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--red);border:1px solid rgba(192,57,43,0.3);background:rgba(192,57,43,0.05);padding:6px 14px;cursor:pointer}
.del-client-btn:hover{background:var(--red);color:var(--white)}
.client-header{padding:22px 26px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;cursor:pointer;border-bottom:1px solid transparent}
.client-card.open .client-header{border-bottom-color:var(--border)}
.client-header:hover{background:rgba(232,160,32,0.02)}
.client-header-left{flex:1}
.client-num-el{font-family:var(--font-acc);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.client-name-el{font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--navy);margin-bottom:4px}
.client-url-el{font-size:13px;color:var(--gray)}
.client-url-el a{color:var(--gold);text-decoration:none}
.client-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.status-badge{font-family:var(--font-acc);font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;padding:4px 12px}
.badge-live{background:rgba(232,160,32,0.12);color:var(--gold);border:1px solid rgba(232,160,32,0.25)}
.badge-concept{background:rgba(123,94,167,0.1);color:var(--purple);border:1px solid rgba(123,94,167,0.25)}
.badge-progress{background:rgba(224,90,43,0.1);color:var(--orange);border:1px solid rgba(224,90,43,0.25)}
.client-price-el{font-family:var(--font-acc);font-size:13px;font-weight:600;color:var(--green)}
.client-date-el{font-size:12px;color:var(--gray)}
.client-toggle{font-size:18px;color:var(--gray);flex-shrink:0;transition:transform 0.2s}
.client-card.open .client-toggle{transform:rotate(180deg)}
.client-body{display:none;padding:24px 26px}
.client-card.open .client-body{display:block}
.client-body-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:16px}
.work-section{margin-bottom:8px}
.work-section-title{font-family:var(--font-acc);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.work-list{list-style:none;display:flex;flex-direction:column;gap:4px}
.work-list li{font-size:14px;color:var(--navy);line-height:1.6;display:flex;gap:8px;align-items:flex-start}
.work-list li::before{content:'·';color:var(--gold);font-size:18px;flex-shrink:0;line-height:1.4}
.item-text{flex:1}
.notes-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.notes-title{font-family:var(--font-acc);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gray);margin-bottom:8px}
.notes-text{font-size:13px;color:var(--gray);line-height:1.7;font-style:italic}
.loading{text-align:center;padding:60px;font-family:var(--font-acc);font-size:14px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray)}
footer{background:var(--navy);padding:24px 28px;text-align:center;font-family:var(--font-acc);font-size:12px;color:#4a6080;letter-spacing:0.06em}
footer span{color:var(--gold)}
@media(max-width:700px){.client-body-grid{grid-template-columns:1fr}.stats-inner{gap:24px}nav{padding:12px 16px}}
</style>
</head>
<body>

<div id="pin-screen">
  <div class="pin-logo">STUD<span>IO</span> <span>VE</span>LOX<span>.</span></div>
  <h2 class="pin-title">Client Work Log</h2>
  <p class="pin-sub">Private — Enter your PIN</p>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-keypad">
    <button class="pin-key" onclick="pp('1')">1</button><button class="pin-key" onclick="pp('2')">2</button><button class="pin-key" onclick="pp('3')">3</button>
    <button class="pin-key" onclick="pp('4')">4</button><button class="pin-key" onclick="pp('5')">5</button><button class="pin-key" onclick="pp('6')">6</button>
    <button class="pin-key" onclick="pp('7')">7</button><button class="pin-key" onclick="pp('8')">8</button><button class="pin-key" onclick="pp('9')">9</button>
    <button class="pin-key"></button><button class="pin-key" onclick="pp('0')">0</button><button class="pin-key del" onclick="pd()">⌫</button>
  </div>
  <div class="pin-error" id="pin-error"></div>
</div>

<div id="app">
<nav>
  <div class="logo">STUD<span>IO</span> <span>VE</span>LOX<span>.</span></div>
  <div class="nav-right">
    <span class="save-indicator" id="save-ind">✓ Saved</span>
    <button class="nav-btn add-client-btn" onclick="addClient()">+ Add Client</button>
    <div class="private-badge">🔒 Private</div>
    <button class="nav-btn edit-btn" id="edit-btn" onclick="toggleEdit()">✏️ Edit Mode</button>
    <button class="nav-btn lock-btn" onclick="lock()">Lock</button>
  </div>
</nav>
<div class="page-header">
  <h1>Client <em>Work Log</em></h1>
  <p>Every client, every site, every piece of work. Click Edit Mode to add, edit or delete anything.</p>
</div>
<div class="stats-bar"><div class="stats-inner" id="stats"></div></div>
<div class="clients-wrap" id="wrap"><div class="loading">Loading...</div></div>
<footer><p>STUD<span>IO</span> <span>VE</span>LOX<span>.</span> &nbsp;·&nbsp; Private Client Log &nbsp;·&nbsp; Not publicly listed</p></footer>
</div>

<script>
// PIN
let pin='',editing=false,clients=[],saveT=null;
function pp(d){if(!d||pin.length>=4)return;pin+=d;dots();if(pin.length===4)checkPin();}
function pd(){pin=pin.slice(0,-1);dots();document.getElementById('pin-error').textContent='';document.querySelectorAll('.pin-dot').forEach(x=>x.classList.remove('error'));}
function dots(){for(let i=0;i<4;i++)document.getElementById('d'+i).classList.toggle('filled',i<pin.length);}
async function checkPin(){
  try{const r=await fetch('/api/checkpin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
  const{ok}=await r.json();
  if(ok){document.getElementById('pin-screen').style.display='none';document.getElementById('app').style.display='block';sessionStorage.setItem('svc','1');load();}
  else pinErr();}catch(e){pinErr();}
}
function pinErr(){document.querySelectorAll('.pin-dot').forEach(x=>{x.classList.remove('filled');x.classList.add('error');});document.getElementById('pin-error').textContent='Incorrect PIN — try again';setTimeout(()=>{document.querySelectorAll('.pin-dot').forEach(x=>x.classList.remove('error'));document.getElementById('pin-error').textContent='';pin='';},1200);}
function lock(){sessionStorage.removeItem('svc');document.getElementById('app').style.display='none';document.getElementById('pin-screen').style.display='flex';pin='';dots();}
if(sessionStorage.getItem('svc')==='1'){document.getElementById('pin-screen').style.display='none';document.getElementById('app').style.display='block';}
document.addEventListener('keydown',e=>{if(document.getElementById('pin-screen').style.display==='none')return;if(e.key>='0'&&e.key<='9')pp(e.key);if(e.key==='Backspace')pd();});

// API
async function load(){
  try{const r=await fetch('/api/clients');const d=await r.json();clients=Array.isArray(d)&&d.length?d:defaults();render();}
  catch(e){clients=defaults();render();}
}
async function save(){
  try{await fetch('/api/clients',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:'__ALL__',clients})});
  const el=document.getElementById('save-ind');el.style.display='inline';setTimeout(()=>el.style.display='none',2000);}
  catch(e){console.error(e);}
}
function sched(){clearTimeout(saveT);saveT=setTimeout(save,1500);}

// Edit mode
function toggleEdit(){
  editing=!editing;
  document.body.classList.toggle('edit-mode',editing);
  const b=document.getElementById('edit-btn');
  b.classList.toggle('active',editing);
  b.textContent=editing?'✓ Done Editing':'✏️ Edit Mode';
  document.querySelectorAll('.editable').forEach(el=>el.contentEditable=editing?'true':'false');
  if(!editing)save();
}

// Render
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function badgeClass(s){return s==='live'?'badge-live':s==='concept'?'badge-concept':'badge-progress';}
function badgeLabel(s){return s==='live'?'Live':s==='concept'?'Concept':'In Progress';}
function cardClass(s){return s==='live'?'status-live':s==='concept'?'status-concept':'status-progress';}

function render(){
  // Stats
  const live=clients.filter(c=>c.status==='live').length;
  const concept=clients.filter(c=>c.status==='concept').length;
  const prog=clients.filter(c=>c.status==='progress').length;
  const gc=clients.filter(c=>(c.location||'').toLowerCase().includes('gold coast')).length;
  document.getElementById('stats').innerHTML=`
    <div class="stat-item"><div class="stat-num">${clients.length}</div><div class="stat-lbl">Total Clients</div></div>
    <div class="stat-item"><div class="stat-num">${live}</div><div class="stat-lbl">Live Sites</div></div>
    <div class="stat-item"><div class="stat-num">${concept}</div><div class="stat-lbl">Concepts</div></div>
    ${prog?`<div class="stat-item"><div class="stat-num">${prog}</div><div class="stat-lbl">In Progress</div></div>`:''}
    <div class="stat-item"><div class="stat-num">${gc}</div><div class="stat-lbl">GC Based</div></div>`;

  // Cards
  document.getElementById('wrap').innerHTML=clients.map((c,ci)=>`
    <div class="client-card ${cardClass(c.status)}" id="card-${c.id}">
      <div class="client-header" onclick="tog('${c.id}')">
        <div class="client-header-left">
          <div class="client-num-el"><span class="editable" contenteditable="false" data-id="${c.id}" data-f="num" onblur="fc(this)">${esc(c.num||String(ci+1).padStart(2,'0'))}</span></div>
          <div class="client-name-el"><span class="editable" contenteditable="false" data-id="${c.id}" data-f="name" onblur="fc(this)">${esc(c.name)}</span></div>
          <div class="client-url-el">
            ${c.url?`<a href="https://${c.url.replace(/^https?:\/\//,'')}" target="_blank" onclick="event.stopPropagation()"><span class="editable" contenteditable="false" data-id="${c.id}" data-f="url" onblur="fc(this)">${esc(c.url)}</span></a>`:`<span class="editable" contenteditable="false" data-id="${c.id}" data-f="url" onblur="fc(this)">${esc(c.url||'')}</span>`}
            <span class="editable" contenteditable="false" data-id="${c.id}" data-f="location" onblur="fc(this)" style="margin-left:4px">${esc(c.location||'')}</span>
          </div>
        </div>
        <div class="client-meta" onclick="event.stopPropagation()">
          <span class="status-badge ${badgeClass(c.status)}">${badgeLabel(c.status)}</span>
          <span class="client-price-el editable" contenteditable="false" data-id="${c.id}" data-f="price" onblur="fc(this)">${esc(c.price||'')}</span>
          <span class="client-date-el editable" contenteditable="false" data-id="${c.id}" data-f="date" onblur="fc(this)">${esc(c.date||'')}</span>
        </div>
        <div class="client-toggle">▾</div>
      </div>
      <div class="client-body">
        <div class="client-body-grid" id="grid-${c.id}">
          ${(c.sections||[]).map((s,si)=>renderSec(c.id,si,s)).join('')}
        </div>
        <div class="add-section-row"><button class="add-section-btn" onclick="addSec('${c.id}')">+ Add Section</button></div>
        <div class="notes-section">
          <div class="notes-title">Outstanding</div>
          <p class="notes-text editable" contenteditable="false" data-id="${c.id}" data-f="outstanding" onblur="fc(this)">${esc(c.outstanding||'Nothing outstanding.')}</p>
        </div>
      </div>
      <div class="card-edit-bar">
        <select class="status-select" onchange="setStatus('${c.id}',this.value)">
          <option value="live" ${c.status==='live'?'selected':''}>Live</option>
          <option value="concept" ${c.status==='concept'?'selected':''}>Concept</option>
          <option value="progress" ${c.status==='progress'?'selected':''}>In Progress</option>
        </select>
        <button class="del-client-btn" onclick="delClient('${c.id}')">🗑 Delete Client</button>
      </div>
    </div>`).join('');

  document.querySelectorAll('.editable').forEach(el=>el.contentEditable=editing?'true':'false');
}

function renderSec(cid,si,s){
  return `<div class="work-section" id="sec-${cid}-${si}">
    <div class="work-section-title">
      <span class="editable" contenteditable="false" data-id="${cid}" data-si="${si}" data-f="stitle" onblur="stc(this)">${esc(s.title)}</span>
      <button class="del-section-btn" onclick="delSec('${cid}',${si})">✕ remove</button>
    </div>
    <ul class="work-list" id="list-${cid}-${si}">
      ${(s.items||[]).map((item,ii)=>`<li>
        <span class="item-text editable" contenteditable="false" data-id="${cid}" data-si="${si}" data-ii="${ii}" data-f="item" onblur="ic(this)">${esc(item)}</span>
        <button class="del-item-btn" onclick="delItem('${cid}',${si},${ii})">×</button>
      </li>`).join('')}
    </ul>
    <div class="add-item-row"><button class="add-item-btn" onclick="addItem('${cid}',${si})">+ Add bullet point</button></div>
  </div>`;
}

// Field change handlers
function fc(el){const c=clients.find(x=>x.id===el.dataset.id);if(!c)return;c[el.dataset.f]=el.innerText.trim();if(el.dataset.f==='status')render();else sched();}
function stc(el){const c=clients.find(x=>x.id===el.dataset.id);if(!c||!c.sections[el.dataset.si])return;c.sections[el.dataset.si].title=el.innerText.trim();sched();}
function ic(el){const c=clients.find(x=>x.id===el.dataset.id);if(!c||!c.sections[el.dataset.si])return;c.sections[el.dataset.si].items[el.dataset.ii]=el.innerText.trim();sched();}

// Actions
function tog(id){const card=document.getElementById('card-'+id);card.classList.toggle('open');}
function setStatus(id,v){const c=clients.find(x=>x.id===id);if(!c)return;c.status=v;render();document.getElementById('card-'+id).classList.add('open');sched();}

function addItem(cid,si){const c=clients.find(x=>x.id===cid);if(!c||!c.sections[si])return;c.sections[si].items.push('New bullet point — click to edit');sched();render();reopenEdit(cid);}
function delItem(cid,si,ii){const c=clients.find(x=>x.id===cid);if(!c||!c.sections[si])return;c.sections[si].items.splice(ii,1);sched();render();reopenEdit(cid);}
function addSec(cid){const c=clients.find(x=>x.id===cid);if(!c)return;if(!c.sections)c.sections=[];c.sections.push({title:'New Section',items:['Click to edit']});sched();render();reopenEdit(cid);}
function delSec(cid,si){if(!confirm('Delete this section?'))return;const c=clients.find(x=>x.id===cid);if(!c)return;c.sections.splice(si,1);sched();render();reopenEdit(cid);}
function delClient(id){if(!confirm('Permanently delete this client? Cannot be undone.'))return;clients=clients.filter(c=>c.id!==id);save();render();}
function reopenEdit(cid){setTimeout(()=>{document.getElementById('card-'+cid)?.classList.add('open');document.querySelectorAll('.editable').forEach(el=>el.contentEditable=editing?'true':'false');},50);}

function addClient(){
  const nc={id:crypto.randomUUID(),num:String(clients.length+1).padStart(2,'0'),name:'New Client — Click to Edit',url:'',location:'Gold Coast',status:'concept',price:'',date:new Date().toLocaleDateString('en-AU',{month:'short',year:'numeric'}),sections:[{title:'Work Completed',items:['Click to add details']},{title:'Status & Notes',items:['Click to add details']}],outstanding:'Click to edit outstanding items.'};
  clients.push(nc);save();render();
  setTimeout(()=>{const card=document.getElementById('card-'+nc.id);if(card){card.classList.add('open');card.scrollIntoView({behavior:'smooth',block:'center'});}document.querySelectorAll('.editable').forEach(el=>el.contentEditable='true');},100);
}
