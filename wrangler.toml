name = "velox-cron"
main = "worker.js"
compatibility_date = "2026-09-25"

# ---------------------------------------------------------------------------
# The schedule
# ---------------------------------------------------------------------------
# Cron Triggers run on UTC. Queensland is UTC+10 all year and never touches
# daylight saving, so the conversion is a flat ten hours and never drifts —
# one of the few genuine advantages of living here.
#
#   Sunday 5:00am AEST  =  Saturday 19:00 UTC  =  "0 19 * * 6"
#                                                      ^ 6 = Saturday
#
# Other options, already converted:
#   Sunday 6:00am AEST  →  "0 20 * * 6"
#   Sunday 9:00pm AEST  →  "0 11 * * 0"
#   Every day 5:00am    →  "0 19 * * *"
# ---------------------------------------------------------------------------
# The database
# ---------------------------------------------------------------------------
# VELOX_DB is the BINDING name, set on the velox Pages project. The database
# itself is called velox_leads. Wrangler commands want the real name:
#
#   npx wrangler d1 execute velox_leads --remote --file=migrations/009_care.sql
#   npx wrangler d1 execute velox_leads --remote --command="SELECT ..."
#
#   uuid 7b5c2752-5325-482e-bb50-fcfbd5cff35a
#
# Using VELOX_DB there makes wrangler search for a database of that name,
# find nothing, and report it as an authentication error. It is not one.

[triggers]
#   2nd of the month 6:00am AEST = 1st 20:00 UTC = "0 20 1 * *"
#     Reports on the previous whole calendar month, so running on the 2nd
#     means October's report goes out on 2 November.
#   Every six hours = "0 */6 * * *"
#     Checks whether newly found businesses actually have a website. This
#     used to be a manual step — cron-search would find leads and then tell
#     you to go and run /api/verify yourself. An unverified lead cannot be
#     scored or routed by /today, so leaving it to memory meant leads
#     quietly piling up unusable. Costs nothing: no billed API behind it.
crons = ["0 19 * * 6", "0 */6 * * *", "0 20 1 * *"]

# ---------------------------------------------------------------------------
# Settings
# ---------------------------------------------------------------------------
# VELOX_API_KEY is a secret, not a var. Set it with:
#   npx wrangler secret put VELOX_API_KEY
# It must match the VELOX_API_KEY on the velox Pages project — one key now
# covers /api/verify, /api/backfill and /api/cron-search.

[vars]
SEARCHES_PER_RUN = "5"
