<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Studio Velox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:wght@300;400;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1628;--navy2:#122040;--gold:#e8a020;--gold2:#f5b732;
  --head:'Playfair Display',Georgia,serif;--body:'Lato',sans-serif;--acc:'Oswald',sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(900px 420px at 70% -10%,rgba(232,160,32,.16),transparent 60%),
    linear-gradient(170deg,var(--navy),var(--navy2));
  color:#fff;font-family:var(--body);font-weight:300;line-height:1.6;
  -webkit-font-smoothing:antialiased}
main{max-width:540px}
.code{font-family:var(--acc);font-weight:600;font-size:13px;letter-spacing:.2em;
  color:var(--gold2);margin:0 0 16px}
h1{font-family:var(--head);font-weight:800;font-size:clamp(28px,6vw,44px);
  line-height:1.12;margin:0 0 16px}
p{font-size:17px;color:#c3cedd;margin:0 0 28px}
.go{display:inline-block;font-family:var(--acc);font-weight:600;font-size:15px;
  letter-spacing:.1em;background:var(--gold);color:var(--navy);
  padding:14px 26px;border-radius:3px;text-decoration:none}
.go:hover{background:var(--gold2)}
.alt{margin:26px 0 0;font-size:15px;color:#8e9bb0}
.alt a{color:var(--gold2)}
</style>
</head>
<body>
<main>
  <p class="code">404 — PAGE NOT FOUND</p>
  <h1>That page isn&rsquo;t here.</h1>
  <p>Either the address has a typo in it, or the page has moved since you last saw it.</p>
  <a class="go" href="/">GO TO THE HOMEPAGE</a>
  <p class="alt">Looking for something specific? Ring Phil on
    <a href="tel:+61422777865">0422&nbsp;777&nbsp;865</a>.</p>
</main>
</body>
</html>
