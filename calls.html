<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Call sheet — Studio Velox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Lato:wght@400;700&display=swap">
<style>
:root{
  --navy:#0a1628; --gold:#e8a020; --gold-ink:#8a5a06; --ink:#15243a;
  --mid:#47607d; --dim:#7a8ca6; --line:#d8e0e8; --red:#c0392b; --green:#1b6b3a;
  --head:'Oswald','Arial Narrow',sans-serif;
  --body:'Lato',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef1f4}
body{font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.45}

/* ---------- pin ---------- */
#pin{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:100;padding:24px;color:#e9eff7}
#pin .logo{font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.3em;color:var(--gold);margin-bottom:8px}
#pin h1{font-family:var(--head);font-weight:500;font-size:28px;margin:0 0 4px}
#pin p{color:#7b93b2;font-size:14px;margin:0 0 30px}
.dots{display:flex;gap:14px;margin-bottom:28px}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2)}
.dot.on{background:var(--gold);border-color:var(--gold)}
.dot.bad{background:var(--red);border-color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.key{width:72px;height:72px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);
  color:#e9eff7;font-family:var(--head);font-size:22px;border-radius:4px;cursor:pointer}
.key:active{background:rgba(232,160,32,.2)}
.key.sm{font-size:14px;color:#7b93b2}
#pin-e{font-family:var(--head);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--red);margin-top:18px;min-height:20px}

/* ---------- controls (screen only) ---------- */
#app{display:none}
.bar{background:var(--navy);color:#e9eff7;padding:14px 20px;position:sticky;top:0;z-index:20;
  display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.bar .brand{font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.22em;color:var(--gold)}
.bar label{font-family:var(--head);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9fb3cc}
.bar select,.bar input{font:inherit;font-size:14px;padding:6px 8px;border-radius:4px;
  border:1px solid rgba(255,255,255,.18);background:#0f2036;color:#e9eff7}
.bar .go{background:var(--gold);border:0;border-radius:4px;color:var(--navy);
  font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 18px;cursor:pointer;margin-left:auto}
.bar .go:hover{filter:brightness(1.08)}
.tally{font-size:13px;color:#9fb3cc;width:100%}

/* ---------- the sheets ---------- */
.sheets{padding:20px}
.page{
  background:#fff;width:210mm;min-height:297mm;margin:0 auto 20px;padding:11mm 13mm;
  box-shadow:0 2px 16px rgba(0,0,0,.18);
}
.ph{display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:2.5pt solid var(--gold);padding-bottom:4px;margin-bottom:6px}
.ph .t{font-family:var(--head);font-weight:600;font-size:13pt;letter-spacing:.04em;color:var(--navy)}
.ph .t small{display:block;font-family:var(--body);font-weight:400;font-size:9pt;
  letter-spacing:0;color:var(--dim);margin-top:2px}
.ph .n{font-family:var(--head);font-size:10pt;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

.biz{display:grid;grid-template-columns:6mm 1fr;gap:0 2.5mm;
  padding:1.3mm 0;border-bottom:.6pt solid var(--line);break-inside:avoid}
.biz:last-child{border-bottom:0}
.num{font-family:var(--head);font-weight:600;font-size:9.5pt;color:var(--dim);text-align:right;padding-top:.6mm}
.top{display:flex;align-items:baseline;gap:3mm;flex-wrap:wrap}
.nm{font-weight:700;font-size:10.5pt;line-height:1.2}
.tel{font-family:var(--head);font-weight:600;font-size:11.5pt;color:var(--navy);
  margin-left:auto;white-space:nowrap;letter-spacing:.01em}
.tel.none{color:var(--red);font-size:10pt}
.meta{font-size:8pt;color:var(--mid);margin:.4mm 0 0;display:flex;gap:0 3mm;flex-wrap:wrap}
.meta .ws{font-family:var(--head);font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase;
  padding:1px 5px;border-radius:2px;background:var(--gold);color:var(--navy)}
.meta .ws.live{background:#e6eaef;color:var(--dim)}
.meta .em{color:var(--gold-ink)}
.open{font-size:7.6pt;color:var(--dim);font-style:italic;margin:.4mm 0 0;line-height:1.3}
.ticks{display:flex;gap:3.5mm;margin:.7mm 0 0;align-items:center}
.ticks span{font-family:var(--head);font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ticks i{display:inline-block;width:3mm;height:3mm;border:.8pt solid var(--dim);
  margin-right:1mm;vertical-align:-.3mm}
.rule{border-bottom:.6pt dotted var(--line);height:3.4mm}

@page{size:A4;margin:12mm 14mm}
@media print{
  html,body{background:#fff}
  .bar,#pin{display:none !important}
  .sheets{padding:0}
  .page{width:auto;min-height:0;margin:0;padding:0;box-shadow:none;
    break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>

<div id="pin">
  <div class="logo">STUDIO VELOX</div>
  <h1>Call sheet</h1>
  <p>Private &mdash; enter your PIN</p>
  <div class="dots" id="dots"></div>
  <div class="pad">
    <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
    <button class="key sm" data-k="del">Del</button><button class="key" data-k="0">0</button><span></span>
  </div>
  <p id="pin-e"></p>
</div>

<div id="app">
  <div class="bar">
    <span class="brand">STUDIO VELOX</span>
    <label for="f-suburb">Suburb</label>
    <select id="f-suburb"><option value="">All</option></select>
    <label for="f-tier">Tier</label>
    <select id="f-tier">
      <option value="prime,strong">Prime + Strong</option>
      <option value="prime">Prime only</option>
      <option value="prime,strong,maybe">Prime + Strong + Maybe</option>
      <option value="">Any</option>
    </select>
    <label for="f-web">Web</label>
    <select id="f-web">
      <option value="gap">No real website</option>
      <option value="">Any</option>
    </select>
    <label for="f-phone">Phone</label>
    <select id="f-phone">
      <option value="1">Has a number</option>
      <option value="">Any</option>
    </select>
    <label for="f-pages">Pages</label>
    <select id="f-pages">
      <option>5</option><option>1</option><option>2</option><option>3</option><option>4</option><option>8</option><option>10</option>
    </select>
    <button class="go" onclick="window.print()">Print</button>
    <p class="tally" id="tally">Loading&hellip;</p>
  </div>

  <div class="sheets" id="sheets"></div>
</div>

<script>
/* ---------------------------------------------------------------------------
   Every /api call carries the PIN; the endpoints check it server-side.
   --------------------------------------------------------------------------- */
var PINLEN = 6;
function svPin(){try{return sessionStorage.getItem('sv_pin')||'';}catch(e){return '';}}
function svSetPin(p){try{sessionStorage.setItem('sv_pin',p);}catch(e){}}
(function(){
  var f=window.fetch;
  window.fetch=function(u,o){
    try{ if(typeof u==='string'&&u.indexOf('/api/')===0){
      o=o||{}; var h=new Headers(o.headers||{}); h.set('X-Velox-Pin',svPin());
      o=Object.assign({},o,{headers:h});
    }}catch(e){}
    return f.call(window,u,o);
  };
})();

(function () {
  'use strict';
  var pin = '', leads = [];
  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- pin ---------------- */
  (function(){ var h=''; for(var i=0;i<PINLEN;i++) h+='<i class="dot" id="d'+i+'"></i>';
    $('dots').innerHTML=h; })();
  function dots(){ for(var i=0;i<PINLEN;i++) $('d'+i).classList.toggle('on', i<pin.length); }
  function press(k){
    if(k==='del'){ pin=pin.slice(0,-1); $('pin-e').textContent=''; dots(); return; }
    if(pin.length>=PINLEN) return;
    pin+=k; dots();
    if(pin.length===PINLEN) check();
  }
  function check(){
    fetch('/api/checkpin',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin:pin})})
      .then(function(r){ return r.json().then(function(d){ return {d:d,status:r.status}; }); })
      .then(function(x){
        if(x.d&&x.d.ok){ svSetPin(pin); unlock(); }
        else bad(x.status===429?'Too many attempts — wait an hour':'');
      }).catch(function(){ bad(); });
  }
  function bad(msg){
    var ds=document.querySelectorAll('.dot');
    ds.forEach(function(d){ d.classList.remove('on'); d.classList.add('bad'); });
    $('pin-e').textContent = msg || 'Wrong PIN';
    setTimeout(function(){ ds.forEach(function(d){ d.classList.remove('bad'); });
      $('pin-e').textContent=''; pin=''; dots(); }, 1100);
  }
  document.querySelectorAll('.key').forEach(function(b){
    b.addEventListener('click',function(){ press(b.getAttribute('data-k')); });
  });
  document.addEventListener('keydown',function(e){
    if($('pin').style.display==='none') return;
    if(e.key>='0'&&e.key<='9') press(e.key);
    if(e.key==='Backspace') press('del');
  });

  function unlock(){ $('pin').style.display='none'; $('app').style.display='block'; load(); }

  /* ---------------- data ---------------- */
  /* A "web gap" is anything that is not a working site of their own. Social and
     aggregator count: a Facebook page or a Fresha link is a conversation, not a
     website. 'live' is the only status that is not a lead. */
  var GAP = ['none','parked','expired','thin','aggregator','social_only','unchecked'];

  var LABEL = {
    none:'No website', parked:'Domain parked', expired:'Domain expired',
    thin:'Stub site', aggregator:'Listing only', social_only:'Social only',
    unchecked:'Not checked', live:'Has website'
  };

  /* Shortened from the runbook. The full reasoning is in Phase 6. */
  var OPENER = {
    parked:      'They registered a domain and never finished it — ask what stalled.',
    expired:     'Their old address is dead or taken over. Check it on your phone first.',
    aggregator:  'Only a listing page. Ask if it is costing them commission.',
    none:        'Lead with their review count, then "I could not find a website — have I missed it?"',
    social_only: 'Reviews and an active feed, nowhere for any of it to land.',
    thin:        'A page exists with nothing on it.',
    unchecked:   'Not verified yet — check before you assert anything.'
  };

  function load(){
    fetch('/api/leads')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var rows = Array.isArray(d) ? d : (d.leads || d.results || []);
        leads = rows;
        fillSuburbs();
        render();
      })
      .catch(function(){ $('tally').textContent = 'Could not load leads. Check the PIN and try again.'; });
  }

  function fillSuburbs(){
    var seen = {};
    leads.forEach(function(l){ if(l.suburb) seen[l.suburb] = (seen[l.suburb]||0)+1; });
    var names = Object.keys(seen).sort();
    var sel = $('f-suburb');
    names.forEach(function(n){
      var o = document.createElement('option');
      o.value = n; o.textContent = n + '  (' + seen[n] + ')';
      sel.appendChild(o);
    });
  }

  function pick(){
    var suburb = $('f-suburb').value;
    var tiers  = $('f-tier').value ? $('f-tier').value.split(',') : null;
    var webGap = $('f-web').value === 'gap';
    var needPhone = $('f-phone').value === '1';

    return leads.filter(function(l){
      if (l.status === 'converted' || l.status === 'skip') return false;
      if (Number(l.score_locked) === 1) return false;
      if (suburb && l.suburb !== suburb) return false;
      if (tiers && tiers.indexOf(l.tier) === -1) return false;
      if (webGap && GAP.indexOf(l.website_status || 'unchecked') === -1) return false;
      if (needPhone && !l.phone) return false;
      return true;
    }).sort(function(a,b){
      /* Suburb first, so a page is one drive. Then best lead at the top of
         each page, because if the morning falls apart after three calls those
         should be the three worth having. */
      var s = (a.suburb||'').localeCompare(b.suburb||'');
      if (s) return s;
      return (b.lead_score||0) - (a.lead_score||0);
    });
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

  function render(){
    var all = pick();
    var pages = Math.min(Number($('f-pages').value) || 5, 10);
    var want = pages * 10;
    var use = all.slice(0, want);

    $('tally').textContent = all.length + ' businesses match. Printing the first '
      + use.length + ' across ' + Math.ceil(use.length/10) + ' page'
      + (use.length>10?'s':'') + '.'
      + (all.length > use.length ? '  ' + (all.length-use.length) + ' more are waiting.' : '');

    var host = $('sheets');
    host.textContent = '';
    var today = new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});
    var total = Math.ceil(use.length/10) || 1;

    for (var p = 0; p < total; p++) {
      var slice = use.slice(p*10, p*10+10);
      var page = document.createElement('div');
      page.className = 'page';
      var subs = {};
      slice.forEach(function(l){ if(l.suburb) subs[l.suburb]=1; });
      var where = Object.keys(subs).join(' · ') || 'Gold Coast';

      var html = '<div class="ph"><div class="t">Call sheet'
        + '<small>' + esc(today) + '  ·  ' + esc(where) + '</small></div>'
        + '<div class="n">Page ' + (p+1) + ' of ' + total + '</div></div>';

      slice.forEach(function(l, i){
        var ws = l.website_status || 'unchecked';
        var meta = [];
        if (l.suburb) meta.push(esc(l.suburb));
        if (l.category) meta.push(esc(l.category));
        if (l.review_count && l.rating) meta.push(esc(l.review_count) + ' reviews at '
          + esc(Number(l.rating).toFixed(1)));   /* 4.8999999999999995 is not a rating */
        if (l.contact_name) meta.push('Ask for ' + esc(l.contact_name));
        if (l.email) meta.push('<span class="em">' + esc(l.email) + '</span>');

        html += '<div class="biz">'
          + '<div class="num">' + (p*10 + i + 1) + '</div>'
          + '<div>'
          +   '<div class="top"><span class="nm">' + esc(l.name) + '</span>'
          +     (l.phone ? '<span class="tel">' + esc(l.phone) + '</span>'
                         : '<span class="tel none">no number — call in</span>')
          +   '</div>'
          +   '<div class="meta"><span class="ws ' + esc(ws) + '">' + esc(LABEL[ws]||ws) + '</span>'
          +     meta.join(' <span>·</span> ') + '</div>'
          +   (OPENER[ws] ? '<div class="open">' + esc(OPENER[ws]) + '</div>' : '')
          +   '<div class="ticks">'
          +     '<span><i></i>Spoke</span><span><i></i>Call back</span><span><i></i>No</span>'
          +   '</div>'
          +   '<div class="rule"></div>'
          + '</div></div>';
      });

      page.innerHTML = html;
      host.appendChild(page);
    }
  }

  ['f-suburb','f-tier','f-web','f-phone','f-pages'].forEach(function(id){
    document.addEventListener('change', function(e){ if(e.target.id===id) render(); });
  });

  if (svPin()) unlock();
})();
</script>
</body>
</html>
